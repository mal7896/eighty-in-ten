<style>
/* Eighty in Ten — the look of a contest answer sheet: warm paper, ink-black type, serif headings that sit
   well beside printed math. One signature detail: the yellow highlighter (the logo, the answer in a worked
   step, the problem you're on in a test). Everything else stays quiet: thin rules, few boxes, one ink-blue
   accent for links and focus. */
:root {
  --bg: #f7f6f2;
  --surface: #ffffff;
  --surface-2: #f1efe9;
  --ink: #1c1b18;
  --ink-2: #4a4842;
  --ink-3: #6b6860;
  --line: #e4e1d8;
  --line-2: #ccc8bc;
  --hi: #ffd54a;          /* highlighter */
  --hi-ink: #1d1a0a;
  --hi-soft: #fff3c2;
  --blue: #2c58c9;        /* ink-blue accent: links, focus, "accurate" */
  --blue-soft: #e8edfa;
  --ok: #1c7646;
  --ok-soft: #e4f2e9;
  --bad: #b3312a;
  --bad-soft: #f9e6e4;
  --warn: #a86a12;        /* "learning" */
  --btn: #1c1b18;
  --btn-hover: #3a3833;
  --btn-ink: #ffffff;
  --shadow: 0 1px 2px rgba(28, 27, 24, .06), 0 8px 24px rgba(28, 27, 24, .06);
  --f-display: "Source Serif 4", "Source Serif Pro", Georgia, "Times New Roman", serif;
  --f-body: "Source Sans 3", "Source Sans Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "Atkinson Hyperlegible Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 10px;
  --r-sm: 7px;
  --top-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131311; --surface: #1b1a17; --surface-2: #23221e; --ink: #ecebe5; --ink-2: #b6b3a9; --ink-3: #8f8c82; --line: #2d2c27; --line-2: #3d3b35;
    --hi: #e6c135; --hi-ink: #16130a; --hi-soft: #3a3318; --blue: #94aefc; --blue-soft: #1d2640; --ok: #55c58b; --ok-soft: #15301f; --bad: #f2877a; --bad-soft: #3b1f1c; --warn: #e3ac55;
    --btn: #ecebe5; --btn-hover: #ffffff; --btn-ink: #131311; --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131311; --surface: #1b1a17; --surface-2: #23221e; --ink: #ecebe5; --ink-2: #b6b3a9; --ink-3: #8f8c82; --line: #2d2c27; --line-2: #3d3b35;
  --hi: #e6c135; --hi-ink: #16130a; --hi-soft: #3a3318; --blue: #94aefc; --blue-soft: #1d2640; --ok: #55c58b; --ok-soft: #15301f; --bad: #f2877a; --bad-soft: #3b1f1c; --warn: #e3ac55;
  --btn: #ecebe5; --btn-hover: #ffffff; --btn-ink: #131311; --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 24px rgba(0, 0, 0, .35); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--f-body); font-size: 17px; line-height: 1.55; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--blue); text-underline-offset: 2px; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; letter-spacing: -0.005em; line-height: 1.2; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.75rem, 1.4rem + 1.2vw, 2.25rem); }
h2 { font-size: 1.3rem; }
h3 { font-size: 1.08rem; }
p { margin: 0; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.small { font-size: .875rem; }
.eyebrow { font-size: .8rem; color: var(--ink-3); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.lede { color: var(--ink-2); max-width: 60ch; margin-top: 8px; }

/* ---------- shell ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: saturate(1.2) blur(8px); -webkit-backdrop-filter: saturate(1.2) blur(8px); border-bottom: 1px solid var(--line); }
.top-in { max-width: 1080px; margin: 0 auto; display: flex; align-items: stretch; gap: 20px; height: var(--top-h); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; text-decoration: none; color: var(--ink); background: none; border: 0; padding: 0; }
.brand b { font-family: var(--f-display); font-size: 1.22rem; font-weight: 700; letter-spacing: -0.01em; }
.brand b i { font-style: normal; background: linear-gradient(transparent 14%, var(--hi) 14%, var(--hi) 90%, transparent 90%); color: var(--hi-ink); padding: 0 3px; margin: 0 2px; }
.nav { display: flex; gap: 2px; margin-left: 8px; }
.nav button { background: none; border: 0; padding: 0 12px; color: var(--ink-2); font-weight: 600; display: flex; align-items: center; gap: 7px; position: relative; font-size: .95rem; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); }
.nav button[aria-current="page"]::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; background: var(--ink); }
.nav svg { display: none; }
.lvl { margin-left: auto; align-self: center; display: flex; align-items: center; gap: 7px; background: none; border: 1px solid var(--line-2); padding: 5px 11px; border-radius: 999px; font-weight: 600; font-size: .86rem; color: var(--ink-2); }
.lvl:hover { color: var(--ink); border-color: var(--ink-3); }
.lvl .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-3); }
main { max-width: 1080px; margin: 0 auto; padding-block: 36px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tabbar { display: none; }
/* while a round, a test or a facts drill is running, the page is just the work */
body.in-session .top { display: none; }
body.in-session main { padding-top: 20px; }
@media (max-width: 760px) {
  .nav { display: none; }
  :root { --top-h: 52px; }
  .tabbar { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .tabbar button { background: none; border: 0; padding: 8px 2px 7px; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .68rem; font-weight: 600; color: var(--ink-3); min-height: 54px; }
  .tabbar button[aria-current="page"] { color: var(--ink); }
  .tabbar button[aria-current="page"] svg { stroke-width: 2.4; }
  .tabbar svg { width: 22px; height: 22px; }
  main { padding-block: 22px 112px; }
  body.in-session .tabbar { display: none; }
  body.in-session main { padding-bottom: 24px; padding-top: 12px; }
}

/* ---------- generic pieces ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: var(--r-sm); padding: 9px 16px; font-weight: 600; border: 1px solid var(--btn); background: var(--btn); color: var(--btn-ink); min-height: 42px; text-decoration: none; transition: background-color .12s, border-color .12s, color .12s; }
.btn:hover { background: var(--btn-hover); border-color: var(--btn-hover); }
.btn:active { transform: translateY(1px); }
.btn.hi { background: var(--btn); }
.btn.hi:hover { background: var(--btn-hover); }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-2); }
.btn.ghost:hover { background: var(--surface-2); border-color: var(--ink-3); }
.btn.small { min-height: 34px; padding: 6px 12px; font-size: .9rem; }
.btn.link { background: none; border-color: transparent; color: var(--blue); padding: 4px 2px; min-height: 0; font-weight: 600; }
.btn.link:hover { text-decoration: underline; text-underline-offset: 3px; background: none; }
.btn[disabled], .btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; pointer-events: none; }
.btn[aria-busy="true"] { cursor: progress; opacity: .75; }
.btn[aria-busy="true"]::before { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 2px solid currentColor; border-right-color: transparent; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.kbd { font-family: var(--f-mono); font-size: .72rem; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; opacity: .55; font-weight: 400; }
/* status: a small dot and a word, not a badge */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; color: var(--ink-2); white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); flex: none; }
.pill.learning::before { background: var(--warn); }
.pill.solid::before { background: var(--blue); }
.pill.fast::before { background: var(--ok); }
.pill.upnext { background: linear-gradient(transparent 14%, var(--hi) 14%, var(--hi) 90%, transparent 90%); color: var(--hi-ink); padding: 0 4px; }
.pill.upnext::before { display: none; }
.pill.hardok { margin-left: 10px; color: var(--ink); }
.pill.hardok::before { background: none; border: 1.5px solid var(--ink); width: 6px; height: 6px; }
.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 1px solid transparent; background: none; padding: 6px 13px; border-radius: 6px; font-weight: 600; color: var(--ink-2); min-height: 34px; font-size: .92rem; }
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--line-2); box-shadow: 0 1px 1px rgba(0, 0, 0, .04); }
mark { background: linear-gradient(transparent 12%, var(--hi) 12%, var(--hi) 88%, transparent 88%); color: var(--hi-ink); padding: 0 3px; }
.back { background: none; border: 0; color: var(--ink-2); font-weight: 600; padding: 4px 0; display: inline-flex; gap: 6px; align-items: center; font-size: .92rem; }
.back:hover { color: var(--ink); }
.empty { border: 1px dashed var(--line-2); border-radius: var(--r); padding: 20px 22px; color: var(--ink-2); background: transparent; }
.rule { border: 0; border-top: 1px solid var(--line); margin: 0; }

/* ---------- math typesetting ---------- */
.m { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; line-height: 1.1; margin: 0 .12em; font-size: .9em; }
.fr .nu { border-bottom: .08em solid currentColor; padding: 0 .2em .05em; }
.fr .de { padding: .05em .2em 0; }
.mw { margin-right: .05em; }
.rt { display: inline-flex; align-items: stretch; white-space: nowrap; }
.rt .rs { font-size: 1.1em; line-height: 1; padding-right: 1px; }
.rt .ri { font-size: .55em; margin-right: -.45em; margin-top: -.1em; }
.rt .rad { border-top: .08em solid currentColor; padding: .05em .15em 0; }
.ol { text-decoration: overline; }
sup, sub { font-size: .62em; line-height: 0; }
.mat { display: inline-flex; vertical-align: middle; padding: 0 .35em; margin: 0 .15em; position: relative; }
.mat.det { border-left: .09em solid currentColor; border-right: .09em solid currentColor; }
.mat.brk::before, .mat.brk::after { content: ""; position: absolute; top: 0; bottom: 0; width: .3em; border: .09em solid currentColor; }
.mat.brk::before { left: 0; border-right: 0; }
.mat.brk::after { right: 0; border-left: 0; }
.mat .mg { display: grid; grid-template-columns: repeat(var(--c), auto); gap: .05em .7em; font-size: .85em; text-align: center; padding: .15em 0; }
.lim { display: inline-flex; flex-direction: column; align-items: center; line-height: 1; vertical-align: middle; margin-right: .15em; }
.lim .lu { font-size: .55em; margin-top: .15em; }
.int { display: inline-flex; align-items: center; vertical-align: middle; }
.int .is { font-size: 1.6em; line-height: 1; }
.int .il { display: inline-flex; flex-direction: column; justify-content: space-between; font-size: .6em; height: 2.7em; margin-left: .1em; margin-right: .25em; line-height: 1; }
.or { color: var(--ink-3); font-family: var(--f-body); font-size: .85em; }

/* ---------- answer blank: a ruled line, like the sheet ---------- */
.blank { display: inline-flex; align-items: baseline; gap: 8px; }
.ans { font-family: var(--f-mono); font-size: inherit; border: 0; border-bottom: 1.5px solid var(--ink-3); background: transparent; padding: 2px 6px 3px; width: 7.5em; min-width: 0; border-radius: 0; color: var(--ink); text-align: center; caret-color: var(--blue); transition: border-color .12s, background-color .12s; }
.ans:hover { border-bottom-color: var(--ink-2); }
.ans:focus { outline: none; border-bottom: 2px solid var(--ink); background: var(--surface-2); }
.ans.ok { border-bottom-color: var(--ok); color: var(--ok); background: transparent; }
.ans.bad { border-bottom-color: var(--bad); color: var(--bad); background: transparent; }
.ans[disabled] { opacity: 1; }
.suffix { color: var(--ink-2); font-size: .8em; }
.formhint { color: var(--ink-3); font-size: .78em; font-family: var(--f-body); }
.preview { min-height: 1.6em; color: var(--ink-3); font-size: .9rem; }

/* ---------- level picker ---------- */
.welcome { max-width: 760px; margin: 6vh auto 0; }
.welcome h1 { font-size: clamp(1.7rem, 1.3rem + 1.4vw, 2.3rem); }
.welcome .lede { font-size: 1.08rem; }
.pick { text-align: left; display: flex; flex-direction: column; gap: 6px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 22px; transition: border-color .12s; }
.pick:hover { border-color: var(--ink-2); }
.pick h2 { font-size: 1.4rem; }
.lvtag { font-size: .8rem; color: var(--ink-3); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.pick .sample { margin-top: 12px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font-size: 1.1rem; border-top: 1px solid var(--line); padding-top: 14px; }
.pick .sample-a { color: var(--ink-3); }

/* ---------- page heads and sections ---------- */
.pagehead { margin-bottom: 28px; }
.pagehead h1 { margin-top: 4px; }
.sect { margin-top: 40px; display: flex; flex-direction: column; gap: 12px; }
.sect-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; padding-bottom: 8px; border-bottom: 1px solid var(--line); }

/* ---------- home ---------- */
.hello { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }
.next { display: grid; grid-template-columns: 1.25fr 1fr; padding: 0; overflow: hidden; }
.next .l { padding: 26px; display: flex; flex-direction: column; gap: 10px; }
.next .l h2 { font-size: 1.5rem; }
/* the one standout on Home: the next trick's problem, set large like a printed sheet */
.next .r { border-left: 1px solid var(--line); padding: 26px; display: flex; flex-direction: column; justify-content: center; gap: 10px; background: var(--surface-2); }
.next .ex { font-size: 1.8rem; }
.next .ex.long { font-size: 1.15rem; }
@media (max-width: 760px) { .next { grid-template-columns: 1fr; } .next .r { border-left: 0; border-top: 1px solid var(--line); } }
.list { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.li { display: flex; align-items: center; justify-content: space-between; gap: 16px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 14px 4px; width: 100%; }
.li > span:first-child { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.li b { font-weight: 700; }
.li .muted { font-size: .92rem; }
.li .arr { color: var(--ink-3); font-size: 1.1rem; transition: transform .12s; }
.li:hover b { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.li:hover .arr { color: var(--ink); transform: translateX(2px); }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
@media (max-width: 860px) { .duo { grid-template-columns: 1fr; gap: 0; } }
.bar { display: flex; height: 8px; border-radius: 999px; overflow: hidden; background: var(--surface-2); }
.bar span { display: block; height: 100%; }
.legend { display: flex; gap: 6px 16px; flex-wrap: wrap; font-size: .85rem; color: var(--ink-2); margin-top: 12px; }
.legend i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }

/* ---------- tricks list ---------- */
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 18px; }
.chip { border: 1px solid var(--line-2); background: transparent; border-radius: 999px; padding: 5px 12px; font-weight: 600; font-size: .86rem; color: var(--ink-2); }
.chip:hover { color: var(--ink); border-color: var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.colhead { display: flex; align-items: baseline; gap: 12px; margin: 40px 0 0; padding-bottom: 10px; border-bottom: 1px solid var(--ink); }
.colhead h2 { font-size: 1.2rem; }
.colhead .rng { font-variant-numeric: lining-nums; }
.colhead .faint { margin-left: auto; }
.tlist { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px; }
@media (max-width: 760px) { .tlist { grid-template-columns: 1fr; } }
.titem { text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 13px 2px; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 14px; align-items: baseline; color: var(--ink); }
.titem h3 { font-family: var(--f-body); font-size: 1rem; font-weight: 700; line-height: 1.35; }
.titem p { grid-column: 1; color: var(--ink-2); font-size: .88rem; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.titem .stc { grid-column: 2; grid-row: 1; display: flex; align-items: center; }
.titem:hover h3 { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }

/* ---------- lesson ---------- */
.lesson { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 36px; align-items: start; }
@media (max-width: 920px) { .lesson { grid-template-columns: 1fr; gap: 24px; } }
.lesson .spot { font-size: 1.08rem; color: var(--ink-2); margin-top: 10px; max-width: 62ch; }
.lesson .spot b { color: var(--ink); }
.lsec { padding-top: 18px; border-top: 1px solid var(--line); }
.lsec > h3 { margin-bottom: 12px; }
.how { counter-reset: s; list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 12px; }
.how li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: baseline; }
.how li::before { content: counter(s) "."; font-weight: 600; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.note { padding: 2px 0 2px 16px; font-size: .96rem; border-left: 2px solid var(--line-2); }
.note.why { border-left-color: var(--blue); }
.note.watch { border-left-color: var(--warn); }
.note b { display: block; margin-bottom: 4px; font-family: var(--f-display); font-size: 1.05rem; font-weight: 600; }
.example .exq { font-size: 1.7rem; margin: 10px 0 14px; overflow-wrap: anywhere; }
.example .exq.long { font-size: 1.15rem; }
.steps { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
.steps li { padding: 9px 12px; border-radius: var(--r-sm); background: var(--surface-2); font-size: .95rem; animation: rise .16s ease; }
.steps li b { font-weight: 700; }
@keyframes rise { from { transform: translateY(3px); opacity: .4; } to { transform: none; opacity: 1; } }
.sticky { position: sticky; top: calc(var(--top-h) + 24px); }
@media (max-width: 920px) { .sticky { position: static; } }
#tryit .preview { min-height: 1.1em; }
#tryit .feedback { min-height: 22px; margin-top: 6px; }
#tryit .under { margin-top: 12px; }

/* ---------- practice round / sprint ---------- */
.session { max-width: 720px; margin: 0 auto; }
.sbar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.sbar .x { background: none; border: 1px solid var(--line-2); border-radius: var(--r-sm); width: 36px; height: 36px; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.sbar .x:hover { color: var(--ink); border-color: var(--ink-3); }
.sbar .what { font-weight: 700; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tally { display: flex; gap: 12px; font-variant-numeric: tabular-nums; font-size: .95rem; font-weight: 600; }
.tally .g { color: var(--ok); }
.tally .r { color: var(--bad); }
.clock { font-size: 1.15rem; font-weight: 700; min-width: 60px; text-align: right; font-variant-numeric: tabular-nums; }
.clock.low { color: var(--bad); }
.prog { height: 2px; background: var(--line); overflow: hidden; margin-bottom: 8px; }
.prog span { display: block; height: 100%; background: var(--ink); transition: width .2s linear; }
/* the problem itself is the page */
.stage { padding: clamp(36px, 9vh, 88px) 0 24px; text-align: center; position: relative; }
.stage .tk { display: block; min-height: 1.3em; font-size: .85rem; color: var(--ink-3); font-weight: 600; }
.stage .star { display: inline-block; margin-left: 8px; font-size: .78rem; font-weight: 700; color: var(--ink-2); border: 1px solid var(--line-2); padding: 1px 8px; border-radius: 999px; }
.prob { font-size: clamp(1.7rem, 1.1rem + 3vw, 2.8rem); line-height: 1.35; margin: 22px 0 26px; overflow-wrap: anywhere; }
.prob.long { font-size: clamp(1.15rem, 0.95rem + 1vw, 1.55rem); max-width: 34ch; margin-left: auto; margin-right: auto; }
.prob.long .fr { font-family: var(--f-mono); }
.stage .ans { font-size: clamp(1.5rem, 1rem + 2vw, 2.1rem); width: min(8em, 100%); }
.stage .blank { justify-content: center; flex-wrap: wrap; font-size: clamp(1.5rem, 1rem + 2vw, 2.1rem); }
.feedback { min-height: 28px; margin-top: 16px; font-weight: 600; }
.feedback.ok { color: var(--ok); }
.feedback.bad { color: var(--bad); }
.feedback.lvl { color: var(--blue); }
.shortcut { text-align: left; margin: 22px auto 0; max-width: 560px; border-top: 1px solid var(--line); padding-top: 18px; }
.shortcut .key { font-size: 1.3rem; margin: 4px 0 12px; }
.under { display: flex; justify-content: center; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
.hintline { text-align: center; margin-top: 28px; }
.shake { animation: shake .26s ease; }
@keyframes shake { 0%, 100% { transform: none; } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.feedback.fadeout { animation: fbfade 1.6s ease forwards; }
@keyframes fbfade { 0% { opacity: 0; } 10% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: 0; } }
.stage.pulse, .tally .g.bump { animation: none; }
.dchip { display: inline-flex; align-items: center; gap: 6px; font-size: .78rem; font-weight: 600; color: var(--ink-2); white-space: nowrap; flex: none; }
.dchip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--line-2); }
.dchip.d-warmup::before { background: var(--ok); }
.dchip.d-contest::before { background: var(--blue); }
.dchip.d-hard::before { background: var(--warn); }
.dchip.d-super { color: var(--bad); }
.dchip.d-super::before { background: var(--bad); }
@media (max-width: 520px) { .sbar .dauto { display: none; } .sbar { gap: 9px; } .sbar .what { font-size: .92rem; } }

/* ---------- keypad (touch devices) ---------- */
.keypad { display: none; }
body.touch .keypad { display: grid; }
.keypad { grid-template-columns: repeat(4, 1fr); gap: 6px; margin-top: 18px; max-width: 420px; margin-left: auto; margin-right: auto; user-select: none; -webkit-user-select: none; }
.keypad button { min-height: 52px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface); font-size: 1.35rem; font-weight: 600; touch-action: manipulation; }
.keypad button:active { background: var(--surface-2); }
.keypad .enter { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); font-family: var(--f-body); font-size: 1rem; }
.keypad .fn { font-family: var(--f-body); font-size: .9rem; color: var(--ink-2); }
.keypad .extra { grid-column: 1 / -1; display: flex; gap: 6px; }
.keypad .extra button { flex: 1; min-height: 44px; font-size: 1.05rem; }
.dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--bg); border-top: 1px solid var(--line); padding: 10px max(12px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-left, 0px)); }
.dock .keypad { margin-top: 0; }

/* ---------- setup screens: one settings block, then a list to pick from ---------- */
.setup { max-width: 820px; }
.cfg { border-top: 1px solid var(--line); }
.cfg-row { display: grid; grid-template-columns: 140px minmax(0, 1fr); gap: 6px 20px; padding: 16px 0; border-bottom: 1px solid var(--line); align-items: start; }
.cfg-l { font-weight: 700; padding-top: 7px; }
.cfg-v { min-width: 0; }
.cfg-v .note-s { margin-top: 8px; color: var(--ink-2); font-size: .88rem; max-width: 58ch; }
@media (max-width: 600px) { .cfg-row { grid-template-columns: 1fr; } .cfg-l { padding-top: 0; } }
.diffnote { margin: 8px 0 0; max-width: 58ch; min-height: 1.5em; }
.label { font-family: var(--f-display); font-weight: 600; font-size: 1.15rem; margin: 32px 0 10px; display: block; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 24px; border-top: 1px solid var(--line); }
@media (max-width: 600px) { .opts { grid-template-columns: 1fr; } }
.opt { text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 12px 4px 12px 34px; display: flex; flex-direction: column; gap: 1px; position: relative; color: var(--ink); }
.opt::before { content: ""; position: absolute; left: 6px; top: 15px; width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line-2); background: var(--surface); }
.opt:hover::before { border-color: var(--ink-3); }
.opt[aria-pressed="true"]::before { border: 5px solid var(--ink); }
.opt b { font-size: .98rem; }
.opt span { font-size: .86rem; color: var(--ink-2); }
.picker { border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 4px 16px 14px; margin-top: 14px; max-height: 420px; overflow: auto; }
.picker h4 { margin: 14px 0 4px; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
.picker label { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: .95rem; cursor: pointer; }
.picker input { width: 17px; height: 17px; accent-color: var(--ink); }
.switch { display: flex; align-items: center; gap: 12px; background: none; border: 0; padding: 4px 0; text-align: left; color: var(--ink); }
.switch .sw { flex: none; width: 36px; height: 22px; border-radius: 999px; background: var(--line-2); position: relative; transition: background .15s; }
.switch .sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .25); transition: transform .15s; }
.switch[aria-checked="true"] .sw { background: var(--ink); }
.switch[aria-checked="true"] .sw::after { transform: translateX(14px); background: var(--bg); }
.switch .swt { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.switch .swt b { font-weight: 600; }
.switch .swt span { font-size: .86rem; color: var(--ink-2); }
.switch.inline { padding: 6px 0; }
.startbar { margin-top: 28px; }
@media (max-width: 760px) {
  .startbar { position: sticky; bottom: calc(64px + env(safe-area-inset-bottom, 0px)); z-index: 5; background: var(--bg); padding: 12px 0; margin-top: 16px; border-top: 1px solid var(--line); }
  .startbar .btn { flex: 1; }
}
body.touch .kbd { display: none; }

/* ---------- test codes ---------- */
.codes { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 36px; }
@media (max-width: 720px) { .codes { grid-template-columns: 1fr; } }
.codebox { padding: 18px 20px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); min-width: 0; }
.codebox label, .codebox > b { font-size: .95rem; line-height: 1.5; }
.field { font-family: var(--f-mono); font-size: 1.05rem; letter-spacing: .06em; text-transform: uppercase; padding: 8px 12px; min-height: 42px; width: 11em; max-width: 100%; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); }
.field::placeholder { text-transform: none; letter-spacing: 0; color: var(--ink-3); }
.field:hover { border-color: var(--ink-3); }
.field:focus { outline: 2px solid var(--blue); outline-offset: 1px; border-color: var(--blue); }
.field[aria-invalid="true"] { border-color: var(--bad); }
.fieldmsg { color: var(--bad); }
.teamcode { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 12px 0 8px; }
.teamcode .mono { font-size: 1.8rem; font-weight: 700; letter-spacing: .08em; color: var(--ink); user-select: all; }
.tcode { letter-spacing: .04em; }

/* ---------- test sheet: the paper ---------- */
.sheet-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 15; background: var(--bg); padding: 10px 0; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 18px; }
.sheet-top .clock { font-size: 1.6rem; text-align: left; }
@media (max-width: 520px) { .sheet-top .tcode { display: none; } }
.pagehead.eyebrow, p.pagehead { margin: 22px 0 8px; }
p.pagehead:first-child { margin-top: 0; }
.sheet { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 6px 0; columns: 2; column-gap: 0; column-rule: 1px solid var(--line); box-shadow: 0 1px 2px rgba(28, 27, 24, .05); }
@media (max-width: 860px) { .sheet { columns: 1; } }
.q { break-inside: avoid; display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 4px 6px; padding: 11px 18px 13px 10px; border-bottom: 1px solid var(--line); align-items: start; }
.q .qn { font-variant-numeric: tabular-nums; color: var(--ink-3); font-size: .9rem; padding-top: 4px; text-align: right; }
.q .qn .s { color: var(--ink); font-weight: 700; }
.q .qb { font-size: 1.05rem; line-height: 1.6; display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
.q .qb .t { min-width: 0; overflow-wrap: anywhere; }
.q .qb .t.long { font-size: .98rem; }
.q .ans { width: 6.5em; font-size: 1.02rem; }
/* the problem you're on: highlighted, the one standout while you work */
.q.cur { background: linear-gradient(90deg, var(--hi-soft), transparent 85%); box-shadow: inset 3px 0 0 var(--hi); }
.q.mark-ok .qn::after { content: " ✓"; color: var(--ok); font-weight: 700; }
.q.mark-bad .qn::after, .q.mark-skip .qn::after { content: " ✗"; color: var(--bad); font-weight: 700; }
.q .keyline { grid-column: 2; font-size: .9rem; color: var(--ink-2); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.q .keyline .m { color: var(--ink); }
.q .why { grid-column: 2; }
.q.after { opacity: .5; }

/* ---------- results ---------- */
.res-top { display: grid; grid-template-columns: auto 1fr; gap: 32px; align-items: center; }
@media (max-width: 640px) { .res-top { grid-template-columns: 1fr; gap: 16px; } }
.big { font-family: var(--f-display); font-size: clamp(3.2rem, 2.2rem + 4vw, 4.8rem); font-weight: 600; line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums lining-nums; }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 14px 20px; }
.kv div { border-left: 1px solid var(--line-2); padding-left: 12px; }
.kv b { display: block; font-size: 1.4rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.kv span { font-size: .82rem; color: var(--ink-2); }
.cols4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.cols4 div { border-top: 1px solid var(--line); padding-top: 8px; }
.cols4 b { font-variant-numeric: tabular-nums; }
.misslist details { border-top: 1px solid var(--line); padding: 12px 0; }
.misslist summary { cursor: pointer; }
.misslist summary:hover { color: var(--ink); }

/* ---------- progress ---------- */
.stats4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.stats4 div { padding: 16px 16px 14px 0; }
.stats4 div + div { padding-left: 16px; border-left: 1px solid var(--line); }
.stats4 b { display: block; font-family: var(--f-display); font-size: 1.9rem; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums lining-nums; }
.stats4 span { font-size: .84rem; color: var(--ink-2); }
@media (max-width: 600px) { .stats4 { grid-template-columns: 1fr 1fr; } .stats4 div:nth-child(3) { border-left: 0; padding-left: 0; } .stats4 div:nth-child(n+3) { border-top: 1px solid var(--line); } }
.heat { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 0 18px; }
.cell { text-align: left; border: 0; border-bottom: 1px solid var(--line); padding: 8px 2px; background: none; font-size: .86rem; font-weight: 600; display: flex; gap: 9px; align-items: center; min-height: 40px; color: var(--ink); }
.cell::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--line-2); }
.cell.learning::before { background: var(--warn); }
.cell.solid::before { background: var(--blue); }
.cell.fast::before { background: var(--ok); }
.cell:hover { text-decoration: underline; text-underline-offset: 3px; }
.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--ink-3); font-family: var(--f-body); font-size: 12px; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .ln { fill: none; stroke: var(--ink); stroke-width: 1.75; }
.chart .area { fill: var(--surface-2); }
.chart .pt { fill: var(--surface); stroke: var(--ink); stroke-width: 1.75; }
.chart .pt.last { fill: var(--hi); }
table.t { width: 100%; border-collapse: collapse; font-size: .92rem; }
table.t th { text-align: left; font-size: .74rem; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 700; padding: 8px 10px; border-bottom: 1px solid var(--ink-3); }
table.t td { padding: 10px; border-bottom: 1px solid var(--line); }
table.t td.n { font-variant-numeric: tabular-nums; text-align: right; }
table.t tbody tr:hover td { background: var(--surface-2); }
.tablewrap { overflow-x: auto; }
.confirm { background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r); padding: 14px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; box-shadow: var(--shadow); }
.confirm b { font-weight: 600; }
.toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: var(--r-sm); font-weight: 600; z-index: 60; box-shadow: var(--shadow); font-size: .92rem; }
.foot { margin-top: 64px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--ink-3); font-size: .84rem; display: flex; justify-content: space-between; gap: 12px 24px; flex-wrap: wrap; }
.foot > span:first-child { max-width: 72ch; }
.foot a { color: var(--ink-2); }
.foot button { background: none; border: 0; color: var(--ink-2); padding: 0; font-weight: 600; }
.foot button:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

/* KaTeX sizing: math sits a touch larger than the text around it, like a printed test */
.katex { font-size: 1.1em; }
.prob .katex, .exq .katex, .next .ex .katex { font-size: 1.1em; }
.steps .katex, .note .katex, .how .katex, .spot .katex, .titem .katex { font-size: 1.04em; }
.q .qb .katex { font-size: 1.12em; }
.prob .katex-display, .q .katex-display { margin: 0; }
h1 .katex, h2 .katex, h3 .katex { font-size: 1em; }
.steps .katex-display { display: inline; margin: 0; }
.fb { font-family: var(--f-mono); }

/* ---------- memorize ---------- */
.msets { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 0 28px; margin-top: 28px; border-top: 1px solid var(--line); }
.mset { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--line); padding: 16px 2px; color: var(--ink); min-width: 0; }
.mset b { font-family: var(--f-display); font-size: 1.12rem; font-weight: 600; }
.mset:hover b { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.mprog { display: flex; flex-direction: column; gap: 6px; width: 100%; margin-top: auto; padding-top: 10px; }
.mhead .mprog { max-width: 320px; margin-top: 10px; }
.mbar { height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; width: 100%; }
.mbar span { display: block; height: 100%; background: var(--ok); border-radius: 999px; }
.mgh { margin: 26px 0 10px; }
.mtable { margin-top: 6px; }
.mgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.mgrid.wide { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.mgrid.tight { grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 4px; }
.mcell { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-sm); padding: 10px 6px; color: var(--ink); min-width: 0; cursor: default; }
.mgrid.tight .mcell { padding: 8px 2px; font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.mcell .mt { font-size: 1.05rem; }
.mcell .mb { color: var(--ink-2); font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: .95rem; line-height: 1.5; text-align: center; overflow-wrap: break-word; }
.mcell .mb2 { display: block; }
.mcell .katex { font-size: 1.02em; }
.mcell.known::before, .mcell.seen::before, .mcell.missed::before { content: ""; position: absolute; top: 6px; right: 6px; width: 6px; height: 6px; border-radius: 50%; }
.mcell.known::before { background: var(--ok); }
.mcell.seen::before { background: var(--warn); }
.mcell.missed::before { background: var(--bad); }
.covered .mcell { cursor: pointer; }
.covered .mcell:not(.open) { border-style: dashed; background: transparent; }
.covered .mcell:not(.open) .mb { visibility: hidden; }
.covered .mcell:hover { border-color: var(--ink-3); }
.mlegend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 16px; }
.mlegend .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; }
.dot.known { background: var(--ok); } .dot.seen { background: var(--warn); } .dot.missed { background: var(--bad); }
.mreveal { font-size: 1.35rem; margin: 6px 0 8px; }
.mlist { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px 18px; margin-top: 12px; }
.mfacts { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px 28px; }
.mf { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; background: none; border: 0; padding: 0; text-align: left; color: var(--ink); min-width: 0; }
.mf:hover b { text-decoration: underline; text-underline-offset: 3px; }
.mf .mprog, .mhead .mprog { margin-top: 0; padding-top: 6px; }
.mgrid.words .mb { font-family: inherit; font-size: .9rem; }
.mgrid.words .mt { font-weight: 600; font-size: 1rem; }
.codearea { display: block; width: 100%; margin-top: 12px; font-family: var(--f-mono); font-size: .8rem; line-height: 1.4; padding: 10px 12px; border: 1px solid var(--line-2); border-radius: var(--r-sm); background: var(--surface); color: var(--ink); resize: vertical; word-break: break-all; }
.codearea:focus { outline: 2px solid var(--blue); outline-offset: 1px; }
details.rules { margin-top: 36px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 14px 0; }
details.rules summary { cursor: pointer; font-weight: 700; }
details.rules summary:hover { color: var(--ink); }
details.rules .grid2 { margin-top: 14px; }
.top { background: var(--bg); }
@supports (background: color-mix(in srgb, red 50%, transparent)) { .top { background: color-mix(in srgb, var(--bg) 92%, transparent); } }
@media (max-width: 600px) { .seg button { padding: 6px 9px; font-size: .9rem; } .cfg-row { padding: 14px 0; } }
.sheet-top .x { background: none; border: 1px solid var(--line-2); border-radius: var(--r-sm); width: 36px; height: 36px; display: grid; place-items: center; color: var(--ink-2); flex: none; }
.sheet-top .x:hover { color: var(--ink); border-color: var(--ink-3); }

/* ---------- polish pass ---------- */
/* the answer line stays a line when focused: no grey block */
.ans:focus { background: transparent; border-bottom: 2px solid var(--ink); }
.q.cur .ans:focus { background: transparent; }
/* a format note ("Arabic numeral", "decimal") sits small under a big answer line, not beside it */
.stage .blank .formhint { flex-basis: 100%; font-size: .95rem; margin-top: 6px; }
.stage .blank .suffix { font-size: .7em; }
/* before a level is picked there is nowhere to go yet */
body.nolevel .nav, body.nolevel .tabbar, body.nolevel .lvl { display: none; }
body.nolevel main { padding-bottom: 48px; }
/* lessons on narrow screens: a way to get to the five problems without scrolling past everything */
.jump { display: none; margin-top: 14px; }
@media (max-width: 920px) { .jump { display: inline-flex; } }
#tryit { scroll-margin-top: 16px; }
.kv { grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); }
#tryit .blank { flex-wrap: wrap; justify-content: center; }
#tryit .blank .formhint { flex-basis: 100%; text-align: center; font-size: .85rem; margin-top: 4px; }
.stage .prob { margin-bottom: 12px; }

/* ---- live stats under the progress line ---- */
.lstats { display: flex; justify-content: flex-end; gap: 18px; font-size: .82rem; color: var(--ink-3); margin: 2px 0 6px; font-variant-numeric: tabular-nums; }
.lstats b { color: var(--ink-2); font-weight: 600; }

/* ---- trick picker: name with a sample problem ---- */
.picker label { align-items: flex-start; padding: 7px 0; border-bottom: 1px solid var(--line); }
.picker label:last-child { border-bottom: 0; }
.picker input { margin-top: 3px; flex: none; }
.pk { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 14px; flex: 1; min-width: 0; }
.pkn { font-weight: 600; }
.pke { color: var(--ink-3); font-size: .88rem; min-width: 0; max-width: 100%; overflow-x: auto; }
.pke .katex { font-size: 1em; }

/* ---- arithmetic warm-up ranges ---- */
.arith { display: grid; gap: 10px; }
.arow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.arow .chip { min-width: 132px; text-align: left; }
.arow .rng { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; color: var(--ink-3); font-size: .88rem; }
.arow .rng .op { color: var(--ink); font-weight: 700; padding: 0 4px; }
.field.rin { width: 5.2em; min-height: 36px; padding: 5px 8px; font-size: .95rem; letter-spacing: 0; text-align: right; }
.arow .chip[aria-pressed="false"] + .rng { opacity: .55; }
@media (max-width: 520px) { .arow .chip { min-width: 0; } .field.rin { width: 4.4em; } }
.arow .chip[aria-pressed="true"] { background: var(--surface); color: var(--ink); border-color: var(--ink); }
.arow .chip::before { content: ""; display: inline-block; width: 13px; height: 13px; border: 1.5px solid var(--line-2); border-radius: 3px; margin-right: 8px; vertical-align: -2px; }
.arow .chip[aria-pressed="true"]::before { background: var(--ink); border-color: var(--ink); box-shadow: inset 0 0 0 2px var(--surface); }

/* ---- printable test: UIL layout on letter paper ---- */
.paper { --uk: 1; display: grid; gap: calc(24px * var(--uk)); margin-top: 22px; justify-content: start; }
.upage { --ufs: 11pt; width: 8.5in; height: 11in; padding: .5in .55in .45in; background: #fff; color: #111; border: 1px solid var(--line); box-shadow: 0 1px 3px rgba(0,0,0,.06); overflow: hidden; position: relative;
  font-family: var(--f-display); font-weight: 600; font-size: var(--ufs); line-height: 1.25; zoom: var(--uk); }
.upage .katex { font-size: 1.08em; }
.uhead { text-align: center; }
.uhead h2 { font-size: 1.45em; margin: 0; line-height: 1.2; }
.uhead p { font-size: 1.2em; margin: 0; font-weight: 700; }
.ubox { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 2px; }
.ucn { display: flex; align-items: flex-end; gap: 6px; font-size: .92em; margin-bottom: 30px; }
.ucn i, .uscore i { display: inline-block; border-bottom: 1px solid #111; }
.ucn i { width: 1.2in; }
.uscore { border-collapse: collapse; font-family: var(--f-body); font-weight: 400; font-size: .88em; }
.uscore td { padding: 2px 4px; }
.uscore td:first-child { text-align: right; }
.uscore i { width: .62in; height: 1em; }
.uscore .ul td { font-weight: 700; font-size: .85em; text-align: center; padding-top: 0; }
.uwarn { display: grid; grid-template-columns: 1fr 1.3fr 1fr; font-size: .9em; font-weight: 700; margin: 4px 0 12px; }
.uwarn span:nth-child(2) { text-align: center; }
.udir { font-weight: 400; font-size: .93em; line-height: 1.3; margin: 0 0 12px; text-align: justify; }
.udir b { font-weight: 700; }
.uconduct, .ustop { font-family: var(--f-body); font-weight: 700; font-size: .82em; margin: 0 0 12px; }
.ustop { text-align: center; margin-bottom: 22px; }
.ucols { display: grid; grid-template-columns: 1fr 1fr; gap: 0 .3in; }
.uq { display: grid; grid-template-columns: 3.1em minmax(0, 1fr); gap: 0 .35em; align-items: baseline; padding: var(--ugap, .48em) 0; break-inside: avoid; }
.un { text-align: right; white-space: nowrap; }
.ut { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 .3em; min-width: 0; }
.up { min-width: 0; overflow-wrap: anywhere; }
.ub { flex: 1 0 1.25in; display: flex; align-items: baseline; gap: .3em; }
.ub i { flex: 1; height: 1em; border-bottom: 1px solid #111; }
.ub .sx { white-space: nowrap; }
.ufoot { position: absolute; left: .55in; right: .55in; bottom: .22in; margin: 0; text-align: center; font-family: var(--f-body); font-weight: 400; font-size: 7.5pt; color: #666; }
.ukey h2 { font-size: 1.2em; margin: 10px 0 2px; }
.unot { font-weight: 700; font-size: 1.05em; margin: 0 0 8px; }
.unote { font-weight: 700; font-size: .9em; line-height: 1.35; margin: 0 0 14px; }
.ukcols { display: grid; gap: 0 .25in; }
.ukcols.k4 { grid-template-columns: repeat(4, 1fr); }
.ukcols.k2 { grid-template-columns: repeat(2, 1fr); max-width: 4.5in; }
.uk { display: grid; grid-template-columns: 3.1em minmax(0, 1fr); gap: .35em; padding: .3em 0; font-weight: 400; }
.uk .un { font-weight: 600; }
@media print {

NS.check = function (spec, raw) {
  const p = NS.parseInput(raw);
  if (p.kind === 'empty') return { ok: false, empty: true };
  if (spec.type === 'text') {
    const want = [spec.v, ...(spec.alts || [])].map(x => normText(x, spec.kind));
    const got = normText(raw, spec.kind);
    if (want.includes(got)) return { ok: true };
    if (spec.kind === 'base' && p.kind === 'num' && want.includes(normText(String(raw), 'base'))) return { ok: true };
    return { ok: false };
  }
  if (p.kind !== 'num') return { ok: false, note: p.kind === 'bad' ? "That isn't a number this site can read." : null };
  const v = spec.v;
  if (spec.est) {
    let lo = v.mul(q(95, 100)), hi = v.mul(q(105, 100));
    if (lo.cmp(hi) > 0) [lo, hi] = [hi, lo];
    const ok = p.v.cmp(lo) >= 0 && p.v.cmp(hi) <= 0;
    return { ok };
  }
  if (!p.v.eq(v)) return { ok: false };
  // value is right; now the contest form rules
  if (p.form === 'frac' && !p.reduced) return { ok: false, note: 'Right value, but fractions have to be in lowest terms.' };
  if (p.form === 'mixed' && (!p.proper || !p.reduced)) return { ok: false, note: 'Right value, but the fraction part has to be proper and in lowest terms.' };
  const f = spec.form || 'any';
  if (f === 'mixed' && !v.isInt() && v.abs().cmp(1) > 0 && p.form !== 'mixed') return { ok: false, note: 'Right value, but this one asks for a mixed number.' };
  if (f === 'frac' && !v.isInt() && p.form !== 'frac') return { ok: false, note: 'Right value, but this one asks for a common fraction.' };
  if (f === 'dec' && !v.isInt() && p.form !== 'dec') return { ok: false, note: 'Right value, but this one asks for a decimal.' };
  return { ok: true };
};

/* ---------- display the key ---------- */
NS.keyHtml = function (spec) {
  if (spec.show) return spec.show;
  if (spec.type === 'text') { const v = spec.kind === 'complex' ? mk(spec.v.replace(/-/g, '-')) : spec.kind === 'ratio' ? mk(spec.v.replace(':', '\\mathbin{:}')) : esc(spec.v); return v; }
  const v = spec.v;
  if (spec.est) {
    const a = v.mul(q(95, 100)), b = v.mul(q(105, 100));
    const lo = a.cmp(b) < 0 ? a : b, hi = a.cmp(b) < 0 ? b : a;
    const ceil = x => { const n = x.n / x.d; return (x.n % x.d === 0n || x.n < 0n) ? n : n + 1n; };
    const floor = x => { const n = x.n / x.d; return (x.n % x.d === 0n || x.n > 0n) ? n : n - 1n; };
    return `${M.fmt(ceil(lo).toString())} to ${M.fmt(floor(hi).toString())}`.replace(/-(?=\d)/g, '−');
  }
  if (v.isInt()) return H.n(v.n.toString()).h;
  const f = spec.form || 'any';
  if (f === 'money') return v.isInt() ? v.n.toString() : v.num().toFixed(2);
  if (f === 'dec') return H.dec(v).h;
  if (f === 'frac') return H.Qi(v).h;
  const parts = [];
  if (f === 'mixed' || v.abs().cmp(1) > 0) parts.push(H.Qf(v).h);
  if (f !== 'mixed') parts.push(H.Qi(v).h);
  if (f === 'any' && v.terminates()) parts.push(H.dec(v).h);
  return [...new Set(parts)].join('<span class="or"> or </span>');
};
NS.keyText = function (spec) { // plain text key (for aria / tests)
  if (spec.type === 'text') return spec.v;
  if (spec.est) return '≈' + spec.v.num();
  return spec.v.toMixedStr();
};

/* ===== generator registry + multiplication shortcuts ===== */
NS.GENS = [];
NS.fixMinus = s => String(s).replace(/(^|[\s(=:,×+·\/≈\[|])-(?=[\d.(i]|x\b)/g, '$1−');
NS.G = function (def) {
  const raw = def.gen;
  def.gen = function (r, lv, x) { const o = raw.call(this, r, lv, x); o.steps = o.steps.map(NS.fixMinus); return o; };
  NS.GENS.push(def);
};
const { H: _H, M: _M, ans: _A, q: _q, Q: _Q } = NS;
NS.hl = x => `<mark>${x}</mark>`;
NS.fmtn = x => _M.fmt(x).replace(/^-/, '−');
const PLACES = ['ones', 'tens', 'hundreds', 'thousands', 'ten-thousands', 'hundred-thousands', 'millions', 'ten-millions'];

/* column-by-column helper: generic digit convolution, used for ×11, ×111 and FOIL */
NS.convSteps = function (A, B, opts = {}) {
  // A, B: numbers. returns {steps, result}
  const a = String(A).split('').reverse().map(Number), b = String(B).split('').reverse().map(Number);
  const L = a.length + b.length - 1; let carry = 0; const out = []; const steps = [];
  for (let j = 0; j < L; j++) {
    const terms = []; let s = 0;
    for (let i = 0; i < a.length; i++) { const k = j - i; if (k >= 0 && k < b.length && b[k] !== 0) { s += a[i] * b[k]; terms.push(opts.plus ? `${a[i]}` : `${a[i]}×${b[k]}`); } }
    const tot = s + carry; const d = tot % 10; const nc = Math.floor(tot / 10);
    let txt = `<b>${PLACES[j] || '10^' + j}:</b> ${terms.length ? terms.join(' + ') : '0'}`;
    if (carry) txt += ` + ${carry} carried`;
    if (terms.length > 1 || carry) txt += ` = ${tot}`;
    txt += ` → write ${NS.hl(d)}`; if (nc) txt += `, carry ${nc}`;
    steps.push(txt); out.push(d); carry = nc;
  }
  if (carry) { steps.push(`Bring down the last carry: ${NS.hl(carry)}`); }
  return { steps, result: A * B };
};

/* ---------- ×11 and ×111 ---------- */
NS.G({
  id: 'm11', trick: 'times11', col: { ms: 1, hs: 1 }, eval: true,
  gen(r, lv) {
    let n, k = 11;
    if (lv === 'ms') n = r.chance(0.55) ? r.int(23, 98) : r.int(102, 989);
    else if (r.chance(0.35)) { k = 111; n = r.chance(0.5) ? r.int(23, 98) : r.int(102, 899); }
    else n = r.chance(0.5) ? r.int(102, 989) : r.int(1203, 9876);
    const front = r.chance(0.5);
    const p = front ? _H.cat(_H.n(k), ' × ', _H.n(n), ' =') : _H.cat(_H.n(n), ' × ', _H.n(k), ' =');
    const cs = NS.convSteps(n, k, { plus: true });
    const intro = k === 11 ? 'Write the ones digit, then add each pair of neighbors, moving left.' : 'Same idea as ×11, but add digits three at a time.';
    return { p, a: _A.num(n * k), steps: [intro, ...cs.steps, `Answer: ${NS.hl(NS.fmtn(n * k))}`], params: { n, k } };
  },
});

/* ---------- ×25, ×125, ×75, ÷25 (fractions of 100 and 1000) ---------- */
NS.G({
  id: 'm25', trick: 'friendly', col: { ms: 1, hs: 1 }, eval: true,
  gen(r, lv) {
    const kinds = lv === 'ms' ? ['25', '25', '125', '75', '50', 'd25'] : ['25', '125', '75', 'd25', '375', '625', '875'];
    const kd = r.pick(kinds);
    let n, m, p, a, steps;
    if (kd === 'd25') {
      n = r.int(13, 499); if (n % 25 === 0) n++;
      p = _H.cat(_H.n(n), ' ÷ 25 ='); a = _A.num(_q(n, 25));
      steps = ['Dividing by 25 is the same as multiplying by 4 and dividing by 100.', `${n} × 4 = ${n * 4}`, `${n * 4} ÷ 100 = ${NS.hl(_H.dec(_q(n, 25)).h)}`];
      return { p, a, steps, params: { kd, n } };
    }
    const spec = { '25': [25, 100, 4, 1], '50': [50, 100, 2, 1], '125': [125, 1000, 8, 1], '75': [75, 100, 4, 3], '375': [375, 1000, 8, 3], '625': [625, 1000, 8, 5], '875': [875, 1000, 8, 7] }[kd];
    const [mul, big, den, top] = spec; m = mul;
    if (den === 8) n = r.chance(0.8) ? 8 * r.int(3, 60) : 4 * r.int(5, 60);
    else n = r.chance(0.75) ? den * r.int(4, 99) : r.int(14, 250);
    if (n % 10 === 0) n += den;
    p = r.chance(0.5) ? _H.cat(_H.n(n), ' × ', _H.n(m), ' =') : _H.cat(_H.n(m), ' × ', _H.n(n), ' =');
    const qv = _q(n * top, den);
    steps = [`${m} = ${top === 1 ? '' : top}${_H.frac(top === 1 ? 1 : '', den).h.replace('<span class="nu"></span>', '<span class="nu">1</span>')} of ${big}`.replace(/^(\d+) = ([^o]*)/, '$1 = $2'),
      `${top === 1 ? `${n} ÷ ${den}` : `${n} × ${top} ÷ ${den}`} = ${_H.dec(qv).h}`,
      `${_H.dec(qv).h} × ${big} = ${NS.hl(NS.fmtn(n * m))}`];
    steps[0] = `${m} is ${top === 1 ? `1/${den}` : `${top}/${den}`} of ${big}, so divide by ${den}${top === 1 ? '' : `, times ${top},`} then tack on ${big === 100 ? 'two' : 'three'} zeros.`;
    return { p, a: _A.num(n * m), steps, params: { kd, n } };
  },
});

/* ---------- numbers near 100 (and 1000) ---------- */
NS.G({
  id: 'near100', trick: 'near100', col: { ms: 1, hs: 1 }, eval: true,
  gen(r, lv) {
    const kinds = lv === 'ms' ? ['under', 'under', 'over'] : ['under', 'over', 'mixed', 'k'];
    const kd = r.pick(kinds);
    let B = 100, x, y;
    if (kd === 'under') { x = r.int(86, 98); y = r.int(86, 98); }
    else if (kd === 'over') { x = r.int(101, 114); y = r.int(101, 112); }
    else if (kd === 'mixed') { x = r.int(101, 109); y = r.int(89, 98); }
    else { B = 1000; x = r.int(986, 998); y = r.int(985, 999); if (r.chance(0.4)) { x = r.int(1002, 1013); y = r.int(1002, 1015); } }
    const p = _H.cat(_H.n(x), ' × ', _H.n(y), ' =');
    const dx = x - B, dy = y - B, prod = dx * dy, res = x * y;
    const w = B === 100 ? 2 : 3;
    const sg = d => d < 0 ? `${-d} under` : `${d} over`;
    let steps;
    if (kd === 'mixed') {
      steps = [`${x} is ${sg(dx)} ${B}, ${y} is ${sg(dy)}.`,
        `Cross: ${x} − ${-dy} = ${x + dy}, so start from ${x + dy} × ${B} = ${NS.fmtn((x + dy) * B)}.`,
        `Multiply the gaps: ${dx} × ${-dy} = ${-prod}. Subtract it: ${NS.fmtn((x + dy) * B)} − ${-prod} = ${NS.hl(NS.fmtn(res))}`];
    } else {
      const left = x + dy; const gp = Math.abs(prod);
      steps = [`${x} is ${sg(dx)} ${B}, ${y} is ${sg(dy)}.`,
        `Cross: ${x} ${dy < 0 ? '−' : '+'} ${Math.abs(dy)} = ${left}. That's the front.`,
        `Gaps multiplied: ${Math.abs(dx)} × ${Math.abs(dy)} = ${gp}. Write it with ${w} digits: ${String(gp).padStart(w, '0')}${String(gp).length > w ? ' (carry the extra into the front)' : ''}.`,
        `Answer: ${NS.hl(NS.fmtn(res))}`];
    }
    return { p, a: _A.num(res), steps, params: { x, y } };
  },
});

/* ---------- squares ending in 5 ---------- */
NS.G({
  id: 'sq5', trick: 'square5', col: { ms: 1, hs: 1 }, eval: true,
  gen(r, lv) {
    const kd = lv === 'ms' ? r.pick(['2', '2', '2', 'dec']) : r.pick(['2', '3', '3', 'dec']);
    let t, p, val, front, steps;
    if (kd === 'dec') {
      t = r.int(1, lv === 'ms' ? 9 : 14); const s = `${t}.5`; val = _Q.parseNum(s).pow(2);
      p = _H.cat(_H.pow(s, 2), ' ='); front = t * (t + 1);
      steps = [`Ignore the decimal: ${t}5² → ${t} × ${t + 1} = ${front}, tack on 25 → ${front}25.`, `One decimal place squared is two places: ${NS.hl(_H.dec(val).h)}`];
      return { p, a: _A.num(val), steps, params: { kd, t } };
    }
    t = kd === '2' ? r.int(1, 9) : r.int(10, lv === 'hs' ? 19 : 12);
    const n = 10 * t + 5; val = n * n; front = t * (t + 1);
    p = r.chance(0.8) ? _H.cat(_H.pow(n, 2), ' =') : _H.cat(_H.n(n), ' × ', _H.n(n), ' =');
    steps = [`Take the front, ${t}, times one more: ${t} × ${t + 1} = ${front}.`, `Tack on 25: ${NS.hl(NS.fmtn(val))}`];
    return { p, a: _A.num(val), steps, params: { n } };
  },
});

/* ---------- same front, backs add to 10 (and the flip) ---------- */
NS.G({
  id: 'sameFront', trick: 'sameFront', col: { ms: 1, hs: 1 }, eval: true,
  gen(r, lv) {
    const flip = r.chance(lv === 'ms' ? 0.25 : 0.4);
    if (!flip) {
      const t = lv === 'hs' && r.chance(0.3) ? r.int(10, 15) : r.int(1, 9);
      let b = r.int(1, 9); if (b === 5) b = r.pick([1, 2, 3, 4, 6, 7, 8, 9]);
      const x = 10 * t + b, y = 10 * t + (10 - b);
      const p = _H.cat(_H.n(x), ' × ', _H.n(y), ' =');
      const f = t * (t + 1), bk = b * (10 - b);
      return { p, a: _A.num(x * y), params: { x, y }, steps: [`Fronts match (${t}) and the backs add to 10 (${b} + ${10 - b}).`, `Front × next number: ${t} × ${t + 1} = ${f}.`, `Backs multiplied, always two digits: ${b} × ${10 - b} = ${String(bk).padStart(2, '0')}.`, `Answer: ${NS.hl(NS.fmtn(x * y))}`] };
    }
    let a = r.int(1, 9), c = 10 - a, b = r.int(1, 9); if (a === c) { a = 3; c = 7; }
    const x = 10 * a + b, y = 10 * c + b;
    const p = _H.cat(_H.n(x), ' × ', _H.n(y), ' =');
    return { p, a: _A.num(x * y), params: { x, y }, steps: [`Backs match (${b}) and the fronts add to 10 (${a} + ${c}).`, `Fronts multiplied plus the back: ${a} × ${c} + ${b} = ${a * c + b}.`, `Back squared, two digits: ${b}² = ${String(b * b).padStart(2, '0')}.`, `Answer: ${NS.hl(NS.fmtn(x * y))}`] };
  },
});

/* ---------- two numbers ending in 5 ---------- */
NS.G({
  id: 'end5', trick: 'end5', col: { ms: 2, hs: 1 }, eval: true,
  gen(r, lv) {
    let a = r.int(1, 9), b = r.int(1, 9); if (a === b) b = a === 9 ? 2 : a + 1 + r.int(0, 8 - a);
    if (lv === 'hs' && r.chance(0.3)) a = r.int(10, 13);
    const x = 10 * a + 5, y = 10 * b + 5;
    const even = (a + b) % 2 === 0; const front = a * b + Math.floor((a + b) / 2);
    return {
      p: _H.cat(_H.n(x), ' × ', _H.n(y), ' ='), a: _A.num(x * y), params: { x, y },
      steps: [`Fronts: ${a} and ${b}. Their sum ${a + b} is ${even ? 'even, so the answer ends in 25' : 'odd, so the answer ends in 75'}.`,
        `Front part: ${a} × ${b} + half of ${a + b}${even ? '' : ' (round down)'} = ${a * b} + ${Math.floor((a + b) / 2)} = ${front}.`,
        `Answer: ${NS.hl(NS.fmtn(x * y))}`],
    };
  },
});

/* ---------- squares near 50 and near 100 ---------- */
NS.G({
  id: 'sq50', trick: 'squares50', col: { ms: 1, hs: 1 }, eval: true,
  gen(r, lv) {
    const near100 = r.chance(lv === 'ms' ? 0.35 : 0.45);
    if (!near100) {
      let k = r.int(1, 9) * r.sign(); const n = 50 + k;
      const p = r.chance(0.8) ? _H.cat(_H.pow(n, 2), ' =') : _H.cat(_H.n(n), ' × ', _H.n(n), ' =');
      return { p, a: _A.num(n * n), params: { n }, steps: [`${n} is ${Math.abs(k)} ${k > 0 ? 'above' : 'below'} 50.`, `Front: 25 ${k > 0 ? '+' : '−'} ${Math.abs(k)} = ${25 + k}.`, `Back: ${Math.abs(k)}² = ${String(k * k).padStart(2, '0')}.`, `Answer: ${NS.hl(NS.fmtn(n * n))}`] };
    }
    let k = r.int(1, 9) * r.sign(); if (lv === 'hs' && r.chance(0.3)) k = r.int(10, 13) * r.sign();
    const n = 100 + k;
    const p = _H.cat(_H.pow(n, 2), ' =');
    const b2 = k * k;
    return { p, a: _A.num(n * n), params: { n }, steps: [`${n} is ${Math.abs(k)} ${k > 0 ? 'above' : 'below'} 100.`, `Front: ${n} ${k > 0 ? '+' : '−'} ${Math.abs(k)} = ${n + k}.`, `Back: ${Math.abs(k)}² = ${b2}, written as two digits${b2 >= 100 ? ' (carry the 1)' : `: ${String(b2).padStart(2, '0')}`}.`, `Answer: ${NS.hl(NS.fmtn(n * n))}`] };
  },
});

/* ---------- equally spaced around a middle ---------- */
NS.G({
  id: 'equi', trick: 'equidistant', col: { ms: 2, hs: 1 }, eval: true,
  gen(r, lv) {
    if (lv === 'hs' && r.chance(0.2)) { // decimals
      const m = r.int(3, 9), d = r.int(1, 4);
      const x = `${m - 1}.${10 - d}`, y = `${m}.${d}`;
      const val = _Q.parseNum(x).mul(_Q.parseNum(y));
      return { p: _H.cat(_H.dec(x), ' × ', _H.dec(y), ' ='), a: _A.num(val), params: { x, y }, steps: [`Both are 0.${d} from ${m}.`, `${m}² − 0.${d}² = ${m * m} − ${_H.dec(_q(d * d, 100)).h} = ${NS.hl(_H.dec(val).h)}`] };
    }
    const m = r.pick(lv === 'ms' ? [20, 30, 40, 50, 60, 70, 80, 25, 35, 45, 55, 65, 75, 85] : [25, 35, 45, 55, 65, 75, 85, 95, 30, 40, 60, 70, 80, 90, 105, 115]);
    let d = r.int(1, 9); if (m % 10 === 0 && d === 10) d = 9;
    const x = m - d, y = m + d;
    const p = r.chance(0.5) ? _H.cat(_H.n(x), ' × ', _H.n(y), ' =') : _H.cat(_H.n(y), ' × ', _H.n(x), ' =');
    return { p, a: _A.num(x * y), params: { x, y }, steps: [`${x} and ${y} are both ${d} away from ${m}.`, `So the product is ${m}² − ${d}² = ${NS.fmtn(m * m)} − ${d * d}.`, `Answer: ${NS.hl(NS.fmtn(x * y))}`] };
  },
});

/* ---------- double and half ---------- */
NS.G({
  id: 'dbl', trick: 'doubleHalf', col: { ms: 1, hs: 1 }, eval: true,
  gen(r, lv) {
    const f = r.pick([15, 15, 35, 45, 14, 16, 18, 12, 1.5]);
    let n = 2 * r.int(11, lv === 'ms' ? 49 : 249); if (n % 10 === 0) n += 2;
    let p, val;
    if (f === 1.5) {
      p = _H.cat(_H.dec('1.5'), ' × ', _H.n(n), ' ='); val = _q(3 * n, 2);
      return { p, a: _A.num(val), params: { f, n }, steps: [`Double 1.5 to get 3; halve ${n} to get ${n / 2}.`, `3 × ${n / 2} = ${NS.hl(NS.fmtn(3 * n / 2))}`] };
    }
    val = f * n;
    p = r.chance(0.5) ? _H.cat(_H.n(f), ' × ', _H.n(n), ' =') : _H.cat(_H.n(n), ' × ', _H.n(f), ' =');
    if (f % 2 === 1) return { p, a: _A.num(val), params: { f, n }, steps: [`Double ${f} → ${2 * f}. Halve ${n} → ${n / 2}.`, `${2 * f} × ${n / 2} = ${NS.hl(NS.fmtn(val))}`] };
    return { p, a: _A.num(val), params: { f, n }, steps: [`Halve ${f} → ${f / 2}. Double ${n} → ${2 * n}.`, `${f / 2} × ${2 * n} = ${NS.hl(NS.fmtn(val))}`] };
  },
});

/* ---------- general cross-multiplying (LIOF) ---------- */
NS.G({
  id: 'foil', trick: 'foil', col: { ms: 1, hs: 1 }, eval: true,
  gen(r, lv) {
    let x = r.int(21, 98), y = r.int(21, 98);
    if (lv === 'hs' && r.chance(0.45)) x = r.int(112, 789);
    if (lv === 'ms' && r.chance(0.2)) x = r.int(102, 489);
    if (x % 10 === 0) x++; if (y % 10 === 0) y += 3;
    const cs = NS.convSteps(x, y);
    return { p: _H.cat(_H.n(x), ' × ', _H.n(y), ' ='), a: _A.num(x * y), params: { x, y }, steps: ['Work right to left, one column at a time. Each column adds the cross products that land there.', ...cs.steps, `Answer: ${NS.hl(NS.fmtn(x * y))}`] };
  },
});

/* ---------- reverses: ab × ba ---------- */
NS.G({
  id: 'rev', trick: 'reverses', col: { ms: 2, hs: 1 }, eval: true,
  gen(r) {
    let a = r.int(1, 9), b = r.int(1, 9); if (a === b) b = (a % 9) + 1;
    const x = 10 * a + b, y = 10 * b + a; const ab = a * b, sq = a * a + b * b;
    const o = ab % 10, c1 = Math.floor(ab / 10); const t = sq + c1, tw = t % 10, c2 = Math.floor(t / 10); const h = ab + c2;
    return { p: _H.cat(_H.n(x), ' × ', _H.n(y), ' ='), a: _A.num(x * y), params: { x, y }, steps: [
      `Pattern for reverses: ones = ${a}×${b}, tens = ${a}² + ${b}², hundreds = ${a}×${b}.`,
      `<b>ones:</b> ${a}×${b} = ${ab} → write ${NS.hl(o)}${c1 ? `, carry ${c1}` : ''}`,
      `<b>tens:</b> ${a * a} + ${b * b}${c1 ? ` + ${c1} carried` : ''} = ${t} → write ${NS.hl(tw)}${c2 ? `, carry ${c2}` : ''}`,
      `<b>hundreds:</b> ${ab}${c2 ? ` + ${c2} carried` : ''} = ${h} → write ${NS.hl(h)}`,
      `Answer: ${NS.hl(NS.fmtn(x * y))}`] };
  },
});

/* ---------- ×101 and ×1001 ---------- */
NS.G({
  id: 'm101', trick: 'times101', col: { ms: 1, hs: 1 }, eval: true,
  gen(r, lv) {
    const kd = r.pick(lv === 'ms' ? ['101a', '101b', '1001'] : ['101b', '1001', '101c', '10101']);
    let n, k;

    foil: { unit: 'mult', title: 'Multiplying right to left', s: R`Any two-digit product with no special pattern. This is the default when nothing else fits.`,

    square5: { unit: 'squares', title: 'Squaring numbers ending in 5', s: R`Any number ending in 5, squared.`,

    equidistant: { unit: 'squares', title: 'Equally spaced around a middle', s: R`Two numbers the same distance from an easy middle, like $83 \times 87$ (middle 85).`,
